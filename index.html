<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신정원 스무고개</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
<meta name="description" content="반려견 Javi와 함께하는 정원님 알아보기 O/X 스무고개">
<style>
  :root {
    --ivory: #fbf6e9;
    --paper: #fffdf6;
    --ink: #3d3126;
    --muted: #8a7b68;
    --line: #e9dfc8;
    --o: #4f8a5b;
    --x: #c8553d;
    --gold: #e3b062;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--ivory);
    color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    overflow-x: hidden;
  }
  main {
    min-height: 100vh;
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 20px 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header { text-align: center; margin-bottom: 28px; }
  .q-num { font-family: 'Song Myung', serif; }
  header h1 { font-family: 'Song Myung', 'Nanum Myeongjo', 'AppleMyungjo', serif; font-size: clamp(30px, 9vw, 44px); white-space: nowrap; font-weight: 400; letter-spacing: .06em; color: #5a3f27; margin: 0; text-shadow: 1px 1px 0 rgba(200,160,100,.25); }
  .q-num, .progress { }
  .progress { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 18px; }

  .card {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 34px 26px 30px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(120, 90, 40, .06);
    animation: rise .5s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .intro-dog { margin-bottom: 18px; }
  .bubble { font-size: 18px; line-height: 1.75; margin: 0 0 24px; word-break: keep-all; }
  .bubble b { font-weight: 600; }
  .q-num { font-size: 22px; color: #8a5a2b; letter-spacing: .08em; margin-bottom: 14px; }
  .question { font-size: 21px; line-height: 1.7; font-weight: 500; margin: 0 0 30px; word-break: keep-all; }

  .btn {
    font: inherit; font-size: 15px; font-weight: 600;
    color: var(--paper); background: var(--ink);
    border: 0; border-radius: 999px; padding: 12px 28px; cursor: pointer;
    transition: transform .15s, opacity .15s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }

  /* O / X signs */
  .signs { display: flex; justify-content: center; gap: 28px; }
  .sign {
    all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center;
    transition: transform .2s;
  }
  .sign:hover:not(:disabled) { transform: translateY(-6px) rotate(-2deg); }
  .sign:focus-visible .board { outline: 3px solid var(--gold); outline-offset: 3px; }
  .board {
    width: 120px; height: 120px; border-radius: 18px;
    display: grid; place-items: center;
    font-size: 78px; font-weight: 800; line-height: 1;
    background: #fff; border: 5px solid currentColor;
    box-shadow: 0 6px 0 rgba(0,0,0,.08);
  }
  .stick { width: 10px; height: 46px; background: #d4b98a; border-radius: 0 0 4px 4px; box-shadow: inset -3px 0 0 rgba(0,0,0,.08); }
  .sign.o { color: var(--o); }
  .sign.x { color: var(--x); }
  .sign:disabled { cursor: default; }
  .sign.dim { opacity: .35; }
  .sign.o.picked .board { background: var(--o); color: #fff; }
  .sign.x.picked .board { background: var(--x); color: #fff; }
  .sign.answer .board { box-shadow: 0 0 0 6px rgba(227, 176, 98, .55); }

  .feedback { margin-top: 30px; animation: rise .4s ease both; }
  .verdict { font-size: 22px; font-weight: 700; margin: 0 0 8px; }
  .verdict.good { color: var(--o); }
  .verdict.bad { color: var(--x); }
  .explain { font-size: 16px; line-height: 1.75; color: var(--ink); margin: 0 0 22px; word-break: keep-all; }
  [hidden] { display: none !important; }

  /* ---------- Javi, the illustrated dog ---------- */
  #dog {
    position: fixed; left: 0; bottom: 4px; width: 190px;
    z-index: 10; pointer-events: none; will-change: transform;
  }
  #dog .inner { transition: transform .3s; }
  #dog.face-left .inner { transform: scaleX(-1); }
  #dog svg { display: block; width: 100%; height: auto; overflow: visible; }
  #dog.react { visibility: hidden; }
  .leg { transform-box: view-box; }
  .tail { transform-box: fill-box; transform-origin: 90% 90%; animation: wag 1.3s ease-in-out infinite; }
  .walking .leg.a { animation: step .95s ease-in-out infinite; }
  .walking .leg.b { animation: step .95s ease-in-out infinite reverse; }
  .walking .body-bob { animation: bob .475s ease-in-out infinite; }
  .walking .head-bob { animation: nod .95s ease-in-out infinite; }
  @keyframes step { 0%,100% { transform: rotate(-20deg); } 50% { transform: rotate(20deg); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
  @keyframes nod { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(2deg); } }
  @keyframes wag { 0%,100% { transform: rotate(-9deg); } 50% { transform: rotate(12deg); } }
  .ftail { transform-box: fill-box; transform-origin: 20% 90%; animation: wag 1.1s ease-in-out infinite; }

  /* front-facing expressions */
  .face .happy, .face .sad, .face .calm { display: none; }
  .face.is-happy .happy, .face.is-sad .sad, .face.is-calm .calm { display: inline; }
  .face .ear-l, .face .ear-r { transform-box: fill-box; transform-origin: 50% 0%; transition: transform .3s; }
  .face.is-sad .ear-l { transform: rotate(9deg); }
  .face.is-sad .ear-r { transform: rotate(-9deg); }
  .face.is-happy .ear-l { transform: rotate(-5deg); }
  .face.is-happy .ear-r { transform: rotate(5deg); }
  .face.is-sad .ftail { animation: none; }
  .face.is-happy { animation: hop .55s ease 2; }
  .face.is-sad { animation: droop .7s ease both; }
  @keyframes hop { 50% { transform: translateY(-14px); } }
  @keyframes droop { from { transform: translateY(-8px); opacity: .5; } to { transform: none; opacity: 1; } }
  .dog-front { height: 190px; display: flex; justify-content: center; }
  .dog-front svg { height: 100%; width: auto; }
  .react-dog { margin: 0 auto 14px; }

  @media (max-width: 480px) {
    .board { width: 96px; height: 96px; font-size: 62px; }
    .signs { gap: 18px; }
    .question { font-size: 19px; }
    #dog { width: 150px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .leg, .tail, .ftail, .body-bob, .head-bob { animation: none !important; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>신정원 스무고개</h1>
    <div class="progress" id="progress"></div>
  </header>

  <!-- intro -->
  <section class="card" id="intro">
    <div class="dog-front intro-dog" data-front="calm" role="img" aria-label="반려견 Javi"></div>
    <p class="bubble">
      안녕하세요? 저는 정원님의 반려견입니다.<br>
      우리 정원님에 대해 궁금하다구요?<br>
      <b>퀴즈를 맞추며 알아가보세요.</b>
    </p>
    <button class="btn" id="start">시작하기</button>
  </section>

  <!-- quiz -->
  <section class="card" id="quiz" hidden>
    <div class="q-num" id="qnum"></div>
    <p class="question" id="question"></p>
    <div class="signs">
      <button class="sign o" data-choice="O" aria-label="O (맞아요)"><span class="board">O</span><span class="stick"></span></button>
      <button class="sign x" data-choice="X" aria-label="X (아니에요)"><span class="board">X</span><span class="stick"></span></button>
    </div>
    <div class="feedback" id="feedback" hidden>
      <div class="dog-front react-dog" id="reactDog" role="img" aria-label="Javi"></div>
      <p class="verdict" id="verdict"></p>
      <p class="explain" id="explain"></p>
      <button class="btn" id="next">다음 문제</button>
    </div>
  </section>

  <!-- end (sample) -->
  <section class="card" id="end" hidden>
    <div class="dog-front intro-dog" data-front="calm" role="img" aria-label="반려견 Javi"></div>
    <p class="bubble" id="endText"></p>
    <button class="btn ghost" id="restart">처음부터 다시</button>
  </section>
</main>

<!-- wandering dog -->
<div id="dog" class="walking" aria-hidden="true"><div class="inner" id="dogSide"></div></div>

<script src="assets/dogs.js"></script>
<script>
/* ---------------- 질문 데이터 (여기에 계속 추가하면 됩니다) ---------------- */
const QUESTIONS = [
  {
    text: "정원님의 반려견인 저, 이름은 Harvey 입니다.",
    answer: "X",
    explain: "반려견의 이름은 Javi (하비, 스페인식 발음) 입니다."
  }
  // { text: "...", answer: "O" | "X", explain: "..." },
];
const TOTAL = 20;
const ORD = ["첫","두","세","네","다섯","여섯","일곱","여덟","아홉","열","열한","열두","열세","열네","열다섯","열여섯","열일곱","열여덟","열아홉","스무"];

var $ = (id) => document.getElementById(id);
/* ---------------- 캐릭터 삽입 ---------------- */
document.body.insertAdjacentHTML("afterbegin", DOG_DEFS);
$("dogSide").innerHTML = DOG_SIDE;
document.querySelectorAll("[data-front]").forEach(el => el.innerHTML = DOG_FRONT);

/* ---------------- 화면 전환 ---------------- */
const intro = $("intro"), quiz = $("quiz"), end = $("end");
let idx = 0, locked = false;

function show(el) { [intro, quiz, end].forEach(s => s.hidden = s !== el); }

function renderQuestion() {
  const q = QUESTIONS[idx];
  $("progress").textContent = `${idx + 1} / ${TOTAL}`;
  $("qnum").textContent = `${ORD[idx]}번째 고개`;
  $("question").textContent = q.text;
  $("feedback").hidden = true;
  document.querySelectorAll(".sign").forEach(b => {
    b.disabled = false;
    b.className = "sign " + b.dataset.choice.toLowerCase();
  });
  locked = false;
  dog.endReact();
}

$("start").onclick = () => { idx = 0; show(quiz); renderQuestion(); };

document.querySelectorAll(".sign").forEach(btn => {
  btn.onclick = () => {
    if (locked) return;
    locked = true;
    const q = QUESTIONS[idx];
    const ok = btn.dataset.choice === q.answer;
    document.querySelectorAll(".sign").forEach(b => {
      b.disabled = true;
      if (b === btn) b.classList.add("picked");
      else b.classList.add("dim");
      if (b.dataset.choice === q.answer) { b.classList.remove("dim"); b.classList.add("answer"); }
    });
    const v = $("verdict");
    v.textContent = ok ? "정답이에요! 🐾" : "앗, 아쉬워요…";
    v.className = "verdict " + (ok ? "good" : "bad");
    $("explain").textContent = (ok ? "" : `정답은 ${q.answer}! `) + q.explain;
    $("next").textContent = idx + 1 < QUESTIONS.length ? "다음 문제" : "마무리";
    $("feedback").hidden = false;
    dog.react(ok ? "happy" : "sad");
  };
});

$("next").onclick = () => {
  idx++;
  if (idx < QUESTIONS.length) { renderQuestion(); return; }
  dog.endReact();
  $("progress").textContent = "";
  $("endText").innerHTML = "샘플은 여기까지예요!<br>나머지 19문제는 곧 만나요. 🐶";
  show(end);
};
$("restart").onclick = () => { idx = 0; show(intro); $("progress").textContent = ""; };

/* ---------------- 돌아다니는 강아지 ---------------- */
const dog = (() => {
  const el = $("dog");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let x = 40, dir = 1, speed = reduce ? 0 : 26;           // px/sec — 천천히
  let mode = "walk", timer = 0, reacting = false;

  const width = () => el.offsetWidth;
  const maxX = () => innerWidth - width() - 8;

  function setMode(m, dur) {
    mode = m; timer = dur;
    el.classList.toggle("walking", m === "walk");
    el.classList.toggle("sitting", m === "sit");
  }
  function pickNext() {
    if (Math.random() < 0.35) setMode("sit", 1.8 + Math.random() * 2);
    else { if (Math.random() < 0.3) dir *= -1; setMode("walk", 4 + Math.random() * 6); }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!reacting) {
      timer -= dt;
      if (timer <= 0) pickNext();
      if (mode === "walk") {
        x += dir * speed * dt;
        if (x > maxX()) { x = maxX(); dir = -1; }
        if (x < 8) { x = 8; dir = 1; }
      }
    }
    el.classList.toggle("face-left", dir < 0);
    el.style.transform = `translateX(${x}px)`;
    requestAnimationFrame(frame);
  }
  setMode("walk", 6);
  requestAnimationFrame(frame);

  return {
    react(kind) {
      reacting = true;
      el.classList.remove("walking");
      el.classList.add("react");
      const r = $("reactDog");
      r.innerHTML = DOG_FRONT;
      r.firstElementChild.setAttribute("class", "face is-" + kind);
    },
    endReact() {
      if (!reacting) return;
      reacting = false;
      el.classList.remove("react");
      setMode("walk", 4);
    }
  };
})();
</script>
</body>
</html>
